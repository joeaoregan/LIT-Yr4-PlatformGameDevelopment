<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" width="100%" height="100%" role="img" aria-label="Space Quest Game Lifecycle &amp; Scene Transition Flow Diagram">
  <defs>
    <style>
      :root {
        --sg-bg: rgba(15, 23, 42, 0.04);
        --sg-header: rgba(37, 99, 235, 0.1);
        --sg-stroke: #334155;
        --sg-title: #0f172a;
        --sg-text: #1e293b;
        --sg-muted: #475569;
        --sg-blue: #2563eb;
        --sg-emerald: #059669;
        --sg-amber: #d97706;
        --sg-rose: #e11d48;
        --sg-purple: #7c3aed;
        --sg-cyan: #0891b2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --sg-bg: rgba(15, 23, 42, 0.70);
          --sg-header: rgba(59, 130, 246, 0.18);
          --sg-stroke: #475569;
          --sg-title: #f8fafc;
          --sg-text: #e2e8f0;
          --sg-muted: #94a3b8;
          --sg-blue: #60a5fa;
          --sg-emerald: #34d399;
          --sg-amber: #fbbf24;
          --sg-rose: #fb7185;
          --sg-purple: #a78bfa;
          --sg-cyan: #22d3ee;
        }
      }

      .box-card {
        fill: var(--sg-bg);
        stroke: var(--sg-stroke);
        stroke-width: 2;
        rx: 10px;
      }

      .box-header {
        fill: var(--sg-header);
        stroke: var(--sg-stroke);
        stroke-width: 1.5;
        rx: 10px;
      }

      .box-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: var(--sg-title);
        text-anchor: middle;
        dominant-baseline: central;
      }

      .box-item {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 500;
        font-size: 12px;
        fill: var(--sg-text);
      }

      .edge-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 700;
        font-size: 10.5px;
        fill: var(--sg-muted);
        text-anchor: middle;
      }

      /* Animated flow paths */
      .flow-blue {
        fill: none;
        stroke: var(--sg-blue);
        stroke-width: 2;
        stroke-dasharray: 6 4;
        animation: dashFlow 1.2s linear infinite;
      }

      .flow-emerald {
        fill: none;
        stroke: var(--sg-emerald);
        stroke-width: 2;
        stroke-dasharray: 6 4;
        animation: dashFlow 1.2s linear infinite;
      }

      .flow-amber {
        fill: none;
        stroke: var(--sg-amber);
        stroke-width: 2;
        stroke-dasharray: 6 4;
        animation: dashFlow 1.2s linear infinite;
      }

      .flow-rose {
        fill: none;
        stroke: var(--sg-rose);
        stroke-width: 2;
        stroke-dasharray: 6 4;
        animation: dashFlow 1.2s linear infinite;
      }

      .flow-purple {
        fill: none;
        stroke: var(--sg-purple);
        stroke-width: 2;
        stroke-dasharray: 6 4;
        animation: dashFlow 1.2s linear infinite;
      }

      .flow-cyan {
        fill: none;
        stroke: var(--sg-cyan);
        stroke-width: 2;
        stroke-dasharray: 6 4;
        animation: dashFlow 1.2s linear infinite;
      }

      @keyframes dashFlow {
        to {
          stroke-dashoffset: -20;
        }
      }

      @keyframes pulseDotD {
        0% { transform: translateY(0px); opacity: 0; }
        25% { opacity: 1; }
        75% { opacity: 1; }
        100% { transform: translateY(35px); opacity: 0; }
      }

      .dot-emerald-d {
        fill: var(--sg-emerald);
        animation: pulseDotD 1.8s ease-in-out infinite;
      }

      .dot-rose-d {
        fill: var(--sg-rose);
        animation: pulseDotD 2.0s ease-in-out infinite;
      }
    </style>

    <!-- Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--sg-blue)" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--sg-emerald)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--sg-amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--sg-rose)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--sg-purple)" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--sg-cyan)" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="20" y="20" width="600" height="640" class="box-card" />
  <rect x="20" y="20" width="600" height="42" class="box-header" />
  <text x="320" y="41" class="box-title">Space Quest Game Lifecycle &amp; Scene Transition Flow</text>

  <!-- Row 1: Startup & Authentication -->
  <!-- Android Sign-In -->
  <rect x="50" y="78" width="220" height="66" rx="8" style="fill: var(--sg-bg); stroke: var(--sg-purple); stroke-width: 1.5;" />
  <text x="160" y="98" class="box-title" style="font-size: 13px; fill: var(--sg-purple);">SignInScene</text>
  <text x="62" y="120" class="box-item" style="font-size: 11px;">• Android Boot Target</text>
  <text x="62" y="134" class="box-item" style="font-size: 10.5px; fill: var(--sg-muted);">• Google Play Games Auth</text>

  <!-- Desktop Splash Screen -->
  <rect x="370" y="78" width="220" height="66" rx="8" style="fill: var(--sg-bg); stroke: var(--sg-blue); stroke-width: 1.5;" />
  <text x="480" y="98" class="box-title" style="font-size: 13px; fill: var(--sg-blue);">SplashScene</text>
  <text x="382" y="120" class="box-item" style="font-size: 11px;">• Win32 Desktop Boot</text>
  <text x="382" y="134" class="box-item" style="font-size: 10.5px; fill: var(--sg-muted);">• Precache Textures &amp; SFX</text>

  <!-- Flow: SignIn to Splash -->
  <line x1="270" y1="111" x2="368" y2="111" class="flow-purple" marker-end="url(#arrow-purple)" />
  <text x="320" y="103" class="edge-label" style="font-size: 9.5px;">Authenticated</text>

  <!-- Row 2: Main Menu Hub -->
  <rect x="200" y="180" width="240" height="96" rx="8" style="fill: var(--sg-header); stroke: var(--sg-blue); stroke-width: 2;" />
  <text x="320" y="200" class="box-title" style="font-size: 14px; fill: var(--sg-blue);">MainMenu Scene</text>
  <text x="212" y="222" class="box-item">• Start Game (TransitionSlideInB)</text>
  <text x="212" y="240" class="box-item">• HighScores / Name (Fade / FadeUp)</text>
  <text x="212" y="258" class="box-item">• Settings / Volume Modulation</text>

  <!-- Flow: Splash to MainMenu -->
  <path d="M 480 144 L 480 162 L 390 162 L 390 178" class="flow-blue" marker-end="url(#arrow-blue)" />
  <text x="460" y="172" class="edge-label" style="font-size: 10px;">TransitionFade</text>

  <!-- Utility Screens (Left Side Hub) -->
  <rect x="42" y="196" width="138" height="74" rx="8" style="fill: var(--sg-bg); stroke: var(--sg-stroke); stroke-width: 1.5;" />
  <text x="111" y="216" class="box-title" style="font-size: 12px;">Utility Screens</text>
  <text x="50" y="238" class="box-item" style="font-size: 10.5px;">• Settings Scene</text>
  <text x="50" y="254" class="box-item" style="font-size: 10.5px;">• HighScores / Name</text>

  <!-- Connectors to Utility Screens -->
  <line x1="200" y1="225" x2="182" y2="225" class="flow-cyan" marker-end="url(#arrow-cyan)" />
  <line x1="182" y1="242" x2="200" y2="242" class="flow-cyan" marker-end="url(#arrow-cyan)" />

  <!-- Flow: Main Menu to Story Scene -->
  <line x1="320" y1="276" x2="320" y2="308" class="flow-emerald" marker-end="url(#arrow-emerald)" />
  <text x="382" y="294" class="edge-label" style="font-size: 10px;">TransitionSlideInB</text>

  <!-- Row 3: Narrative & Interstitial -->
  <rect x="200" y="310" width="240" height="70" rx="8" style="fill: var(--sg-header); stroke: var(--sg-emerald); stroke-width: 1.8;" />
  <text x="320" y="330" class="box-title" style="font-size: 13.5px; fill: var(--sg-emerald);">StoryScene</text>
  <text x="212" y="352" class="box-item">• Mission Briefing Narrative</text>
  <text x="212" y="368" class="box-item">• Tap Screen / Button to Launch</text>

  <!-- Row 4: Gameplay Stages (Level 1 & Level 2) -->
  <!-- Level 1 -->
  <rect x="42" y="416" width="250" height="108" rx="8" style="fill: var(--sg-bg); stroke: var(--sg-emerald); stroke-width: 2;" />
  <text x="167" y="436" class="box-title" style="font-size: 13px; fill: var(--sg-emerald);">Level 1: Asteroid Belt</text>
  <text x="52" y="458" class="box-item">• Asteroid Hazards &amp; Collisions</text>
  <text x="52" y="476" class="box-item">• Scout Drones &amp; Double Lasers</text>
  <text x="52" y="494" class="box-item">• Target Quota Reached → Story</text>
  <text x="52" y="512" class="box-item" style="fill: var(--sg-muted); font-size: 10.5px;">• TransitionZoomFlipY to StoryScene</text>

  <!-- Level 2 -->
  <rect x="348" y="416" width="250" height="108" rx="8" style="fill: var(--sg-bg); stroke: var(--sg-amber); stroke-width: 2;" />
  <text x="473" y="436" class="box-title" style="font-size: 13px; fill: var(--sg-amber);">Level 2: DerpStar Showdown</text>
  <text x="358" y="458" class="box-item">• Deep Space Capital Battle</text>
  <text x="358" y="476" class="box-item">• DerpStar Boss Multi-Phase AI</text>
  <text x="358" y="494" class="box-item">• Heavy Cruiser Escorts</text>
  <text x="358" y="512" class="box-item" style="fill: var(--sg-muted); font-size: 10.5px;">• Victory → CreditsScene</text>

  <!-- Flow: Story to Level 1 -->
  <path d="M 240 380 L 240 398 L 167 398 L 167 414" class="flow-emerald" marker-end="url(#arrow-emerald)" />

  <!-- Flow: Level 1 Cleared back to Story -->
  <path d="M 210 416 L 210 400 L 280 400 L 280 382" class="flow-cyan" marker-end="url(#arrow-cyan)" />
  <text x="246" y="408" class="edge-label" style="font-size: 9.5px;">Cleared</text>

  <!-- Flow: Story to Level 2 -->
  <path d="M 400 380 L 400 398 L 473 398 L 473 414" class="flow-amber" marker-end="url(#arrow-amber)" />

  <!-- Row 5: Outcomes & Completion -->
  <!-- Game Over Scene -->
  <rect x="42" y="556" width="250" height="88" rx="8" style="fill: var(--sg-bg); stroke: var(--sg-rose); stroke-width: 1.8;" />
  <text x="167" y="574" class="box-title" style="font-size: 13px; fill: var(--sg-rose);">GameOverScene</text>
  <text x="52" y="596" class="box-item">• Lives == 0 (TransitionRotoZoom)</text>
  <text x="52" y="614" class="box-item">• Restart → Level1 (ZoomFlipX)</text>
  <text x="52" y="632" class="box-item">• Menu → MainMenu (ZoomFlipX)</text>

  <!-- Credits & Victory Scene -->
  <rect x="348" y="556" width="250" height="88" rx="8" style="fill: var(--sg-bg); stroke: var(--sg-purple); stroke-width: 1.8;" />
  <text x="473" y="574" class="box-title" style="font-size: 13px; fill: var(--sg-purple);">CreditsScene</text>
  <text x="358" y="596" class="box-item">• DerpStar Boss Defeated</text>
  <text x="358" y="614" class="box-item">• Google Play Leaderboard Sync</text>
  <text x="358" y="632" class="box-item">• Return to Menu / Replay</text>

  <!-- Flow: Level 1 to GameOver -->
  <line x1="167" y1="524" x2="167" y2="554" class="flow-rose" marker-end="url(#arrow-rose)" />
  <text x="122" y="542" class="edge-label" style="font-size: 9.5px;">Lives == 0</text>

  <!-- Flow: Level 2 to Credits -->
  <line x1="473" y1="524" x2="473" y2="554" class="flow-purple" marker-end="url(#arrow-purple)" />
  <text x="522" y="542" class="edge-label" style="font-size: 9.5px;">Boss Defeated</text>

  <!-- Animated pulse indicators -->
  <circle cx="320" cy="285" r="3" class="dot-emerald-d" />
  <circle cx="167" cy="532" r="3" class="dot-rose-d" />
</svg>

